name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0"
          PKG_NAME="raven-v${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/stdlib"
          cp build/raven build/ravenc build/rvm "dist/${PKG_NAME}/bin/"
          cp -r stdlib/* "dist/${PKG_NAME}/stdlib/"
          cp README.md install.sh install.ps1 install.bat "dist/${PKG_NAME}/"
          cp LICENSE "dist/${PKG_NAME}/" 2>/dev/null || true
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRAVEN_BUILD_TESTS=OFF

      - name: Build Raven Toolchain (MSVC)
        run: cmake --build build --config Release -j

      - name: Package Windows Release
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.0" }
          $PkgName = "raven-v$Version-windows-x86_64"
          $TargetDir = "dist\$PkgName"
          New-Item -ItemType Directory -Path "$TargetDir\bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "$TargetDir\stdlib" -Force | Out-Null
          
          # Find binaries (Release subfolder for MSVC multi-config)
          if (Test-Path "build\Release\raven.exe") {
              Copy-Item "build\Release\*.exe" "$TargetDir\bin\" -Force
          } else {
              Copy-Item "build\*.exe" "$TargetDir\bin\" -Force
          }
          
          Copy-Item "stdlib\*" "$TargetDir\stdlib\" -Recurse -Force
          Copy-Item "README.md", "install.ps1", "install.bat" "$TargetDir\" -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$TargetDir\" -Force }

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$TargetDir" -DestinationPath "dist\$PkgName.zip" -Force
          $Hash = (Get-FileHash "dist\$PkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $PkgName.zip" | Out-File -Encoding ascii "dist\$PkgName.zip.sha256"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTest
        run: brew install googletest

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Raven Toolchain
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)
      - name: Package macOS Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0"
          PKG_NAME="raven-v${VERSION}-darwin-arm64"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/stdlib"
          cp build/raven build/ravenc build/rvm "dist/${PKG_NAME}/bin/"
          cp -r stdlib/* "dist/${PKG_NAME}/stdlib/"
          cp README.md install.sh "dist/${PKG_NAME}/"
          cp LICENSE "dist/${PKG_NAME}/" 2>/dev/null || true
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Raven ${{ github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            install.sh
            install.ps1
            install.bat
          draft: false
          prerelease: false
          body: |
            ## 🐦 Raven ${{ github.ref_name }} — Corvus Engine & Modern Dual-Engine Toolchain

            ### 🚀 One-Line Installation

            #### Windows (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            #### Linux & macOS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### 📦 Pre-built Binaries
            Download and unpack the pre-compiled archive for your platform below:
            - **Windows x86_64**: `raven-${{ github.ref_name }}-windows-x86_64.zip` (includes `install.bat`)
            - **Linux x86_64**: `raven-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - **macOS Apple Silicon**: `raven-${{ github.ref_name }}-darwin-arm64.tar.gz`

            ### ✨ Key Highlights
            - **Dual-Engine Execution**: AST Tree-Walk (`raven run`) and Corvus Bytecode VM (`ravenc` + `rvm`) with 100% parity
            - **Corvus VM 20× Speedup**: Fast stack-based virtual machine with register caching
            - **Native CSP Concurrency**: Go-style `spawn`, channels, waitgroups, and mutexes
            - **Rich Standard Library**: HTTP, JSON, SQL, Regex, Crypto, Slices, Maps, Collections
            - **All 158 Tests Passing (100% Coverage)**
