name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libgtest-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Raven Toolchain (raven, ravenc, rvm)
      run: cmake --build build --config Release

    - name: Run Full Test Suite (74 Tests)
      run: ctest --test-dir build --output-on-failure

    - name: Run Real-World Projects
      run: |
        ./build/raven examples/projects/01_rest_api_server.rvn
        ./build/raven examples/projects/02_cli_tool.rvn
        ./build/raven examples/projects/03_kv_database_client.rvn
        ./build/raven examples/projects/04_concurrent_task_runner.rvn

    - name: Test Developer Tooling (fmt, vet, doc, bench, init)
      run: |
        ./build/raven fmt examples/go_stdlib_tour.rvn
        ./build/raven vet examples/go_stdlib_tour.rvn
        ./build/raven doc stdlib/strings.rvn
        ./build/raven bench examples/go_stdlib_tour.rvn
        mkdir /tmp/ci_test && cd /tmp/ci_test
        $GITHUB_WORKSPACE/build/raven init ci_app
        cd ci_app && $GITHUB_WORKSPACE/build/raven run src/main.rvn
        rm -rf /tmp/ci_test

    - name: Test Tree-Walk Interpreter (raven)
      run: |
        ./build/raven examples/hello.rvn
        ./build/raven examples/fibonacci.rvn
        ./build/raven examples/while.rvn
        ./build/raven examples/showcase.rvn
        ./build/raven examples/go_stdlib_tour.rvn

    - name: Test Raven Bytecode Compiler (ravenc) & RVM (rvm)
      run: |
        ./build/ravenc examples/hello.rvn -o examples/hello.rvc -O -d
        ./build/rvm -b examples/hello.rvc
        ./build/ravenc examples/while.rvn -o examples/while.rvc -O
        ./build/rvm -b examples/while.rvc
