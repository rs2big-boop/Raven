name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libgtest-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Raven
      run: cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build --output-on-failure

    - name: Run Demo Scripts (Tree-Walk & Bytecode VM)
      run: |
        ./build/raven examples/hello.rvn
        ./build/raven --vm examples/hello.rvn
        ./build/raven --disasm examples/hello.rvn
        ./build/raven examples/fibonacci.rvn
        ./build/raven examples/while.rvn
        ./build/raven examples/showcase.rvn
